<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Muhammad Arslan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main class="login-page">
    <section class="login-card">
      <h1>Welcome Back</h1>
      <p class="login-card__sub">Login to your account</p>

      <p id="formMessage" class="form-message" role="alert"></p>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="email">Email address</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter your password" required>
        </div>

        <div class="btn-row">
          <button type="submit" class="btn">Login</button>
          <a href="logout.html" class="btn btn--danger">Logout</a>
        </div>
      </form>

      <p class="login-card__forgot"><a href="#">Forgot password?</a></p>

      <ul class="site-footer__socials">
        <li><a href="https://www.facebook.com/" target="_blank" rel="noopener" aria-label="Facebook">FB</a></li>
        <li><a href="https://twitter.com/" target="_blank" rel="noopener" aria-label="Twitter">TW</a></li>
        <li><a href="https://github.com/Arslan-web-Dev" target="_blank" rel="noopener" aria-label="GitHub">GH</a></li>
      </ul>

      <hr>
      <p class="login-card__signup">Don't have an account? <a href="#">Sign Up</a></p>
    </section>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('loginForm');
      const message = document.getElementById('formMessage');

      const showMessage = (text, type) => {
        message.textContent = text;
        message.className = 'form-message is-visible ' + (type === 'error' ? 'is-error' : 'is-success');
      };

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value.trim();

        if (!email || !password) {
          showMessage('Please fill in both fields.', 'error');
          return;
        }

        // Demo-only check — replace with real authentication before production use.
        if (email.toLowerCase().endsWith('@gmail.com')) {
          showMessage('Login successful! Redirecting...', 'success');
          setTimeout(() => window.location.replace('index.html'), 1000);
        } else {
          showMessage('Only Gmail accounts are allowed in this demo.', 'error');
        }
      });
    });
  </script>
</body>
</html>
